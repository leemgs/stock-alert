name: Daily Stock Report (1-hour)

on:
  schedule:
    # 정각(:00)은 GitHub 스케줄 지연이 가장 심해 분을 어긋나게 설정한다 (실행이 6~11시간씩 밀리는 사례 확인).
    # 1) 상시 감시: 매시 47분 (미국/일본/홍콩/코인 등 전 종목, 주말 포함)
    - cron: "47 * * * *"
    # 2) 한국 장중 집중 감시: 평일 09:07~15:52 KST (= 00:07~06:52 UTC), 15분 간격
    #    장 마감(15:30 KST) 이후 종가 확정 시점(15:37, 15:52)까지 포함
    - cron: "7,22,37,52 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      test_email:
        description: "테스트 이메일 발송 (임계치 무관, 샘플 알림 1회)"
        type: boolean
        default: false

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    concurrency:
      group: stock-alert-state
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write        # 이메일 발송 실패 시 장애 이슈 자동 등록용
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore runtime state cache
        id: restore-history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/history.json
          key: ${{ runner.os }}-stock-alert-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-stock-alert-state-

      - name: Ensure runtime state files exist
        run: |
          mkdir -p data
          if [ ! -f data/history.json ]; then
            echo '[]' > data/history.json
          fi
          if [ ! -f data/state.json ]; then
            echo '{}' > data/state.json
          fi

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      - name: Run alerts
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          # 이메일 발송 실패 시 GitHub 이슈 자동 등록용(기본 제공 토큰)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch 에서 test_email 체크 시 샘플 테스트 메일 1회 발송 (스케줄 실행 시엔 빈 값)
          STOCK_ALERT_TEST: ${{ github.event.inputs.test_email }}
        run: |
          python src/multi_stock_alert.py

      - name: Sync stock.txt back and commit
        if: success()
        run: |
          if git diff --quiet data/stock.txt; then
            echo "No changes in stock.txt"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/stock.txt
          git commit -m "[Stock Alert] Update thresholds (+/- 10%)"
          # 실행이 잦아져 다른 워크플로(대시보드 데이터)와 push 가 겹칠 수 있으므로 rebase 후 push (최대 4회 재시도)
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "stock.txt 임계값 push 실패" >&2
          exit 1

      # 대시보드는 docs/data/history.json(스냅샷)을 읽는데, 이 스냅샷은 하루 2회만 재생성되어
      # stock.txt 의 임계값 자동 조정(±10%)이 화면에 반영되지 않고 어긋났다.
      # 시세 호출 없이 임계값/이름/도메인/설명만 stock.txt 와 일치시킨다 (변경이 없으면 아무 것도 안 함).
      # stock.txt 변경 여부와 무관하게 매 실행마다 돌려, 어떤 경로로 어긋나도 다음 실행에서 수렴한다.
      - name: Sync dashboard thresholds
        if: success()
        run: bash src/sync_dashboard.sh

      - name: Save runtime state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/history.json
          key: ${{ runner.os }}-stock-alert-state-${{ github.run_id }}
